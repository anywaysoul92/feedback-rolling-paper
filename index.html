<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>교육 피드백 롤링페이퍼</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#2c2c2a;--sub:#5f5e5a;--mute:#888780;--line:#d3d1c7;--accent:#185fa5;--accent-bg:#e6f1fb;--danger:#a32d2d}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#2a2a28;--text:#f1efe8;--sub:#b4b2a9;--mute:#888780;--line:#444441;--accent:#85b7eb;--accent-bg:#0c447c;--danger:#f09595}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:20px;font-weight:600;margin:8px 0 4px}
.desc{font-size:14px;color:var(--sub);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{resize:none;min-height:96px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:16px;cursor:pointer;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 16px}
button.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
button.block{width:100%;margin-top:16px}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--sub)}
.chip[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:600}
.me{font-size:13px;color:var(--sub)}
.me button{min-height:36px;font-size:13px;padding:0 10px}
.hint{font-size:13px;color:var(--sub);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.cnt{font-size:12px;color:var(--mute)}
.err{font-size:13px;color:var(--danger);min-height:18px;margin:8px 0 0}
.banner{font-size:13px;color:var(--sub);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 12px;flex-wrap:wrap}
.total{font-size:13px;color:var(--sub)}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:560px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.note{border-radius:4px;padding:12px;min-height:120px;color:#2c2c2a;box-shadow:0 2px 6px rgba(0,0,0,.18);word-break:break-word;animation:pop .35s ease-out;display:flex;flex-direction:column}
.note.good{background:#faeeda}
.note.improve{background:#e6f1fb}
.note .tag{font-size:11px;font-weight:700;margin-bottom:6px}
.note.good .tag{color:#633806}
.note.improve .tag{color:#0c447c}
.note .body{font-size:14px;white-space:pre-wrap;flex:1}
.note .who{font-size:11px;color:#5f5e5a;margin-top:10px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);font-size:14px;padding:32px 0}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:28px 32px;text-align:center;max-width:320px;width:100%;animation:pop .25s ease-out}
.modal p{margin:0}
.modal .big{font-size:22px;font-weight:700;margin-bottom:6px}
.modal .small{font-size:13px;color:var(--sub)}
.hidden{display:none}
#btnChange{min-height:36px;font-size:13px;padding:0 12px}
.side{width:100%;max-width:560px;margin:0 auto}
.main{min-width:0}
#screenEnter{max-width:480px;margin-left:auto;margin-right:auto}
@media (min-width:900px){
  .wrap{padding:24px 32px 48px}
  h1{font-size:28px;margin-top:0}
  .desc{font-size:15px;margin-bottom:20px}
  .layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
  .side{max-width:none;margin:0;position:sticky;top:24px}
  .side .card{margin-bottom:0}
  .bar{margin-top:0}
  .board{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  textarea{min-height:140px}
  .note{min-height:150px;padding:16px}
  .note .body{font-size:15px}
  .note .tag{font-size:12px}
  .note .who{font-size:12px}
  .total,.chip{font-size:15px}
  button:hover:not(:disabled){border-color:var(--mute)}
}
@media (min-width:1500px){
  .wrap{max-width:1560px}
  .board{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .note .body{font-size:17px}
}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);text-align:center}
.foot a{color:var(--accent);text-decoration:none;word-break:break-all}
.foot a:hover{text-decoration:underline}
.note{position:relative}
.editbtn{align-self:flex-end;min-height:32px;margin-top:6px;padding:0 10px;font-size:12px;border-radius:8px;background:rgba(255,255,255,.55);color:#2c2c2a;border:1px solid rgba(0,0,0,.2)}
#screenSurvey{max-width:560px;margin-left:auto;margin-right:auto}
.rate-q{margin:18px 0 2px;font-size:15px;font-weight:600}
.val{text-align:center;font-size:13px;color:var(--sub);min-height:20px;margin-top:6px}
.slider{padding:0 10%}
.slider input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--accent);cursor:pointer}
.slider.untouched input[type=range]{accent-color:var(--mute)}
.ticks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.ticks button{min-height:44px;border:0;background:transparent;font-size:11px;line-height:1.3;color:var(--mute);padding:0 2px;border-radius:8px;word-break:keep-all}
.ticks button[aria-pressed=true]{color:var(--accent);font-weight:700;background:var(--accent-bg)}
.sumq{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:14px}
.sumq .qt{font-size:13px;color:var(--sub)}
.sumq .avg{font-size:22px;font-weight:700;white-space:nowrap}
.sumq .avg small{font-size:12px;font-weight:400;color:var(--mute)}
.hist{display:flex;gap:8px;align-items:flex-end;height:64px;margin-top:6px}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.hist .n{font-size:11px;color:var(--sub);line-height:1.2}
.hist .fill{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.hlab{display:flex;gap:8px;font-size:11px;color:var(--mute);text-align:center}
.hlab span{flex:1}
</style>
</head>
<body>
<div class="wrap">

<h1 id="title"></h1>
<p class="desc">오늘 교육에 대한 의견을 포스트잇으로 남겨주세요.</p>
<div id="modeBanner" class="banner hidden"></div>

<section id="screenEnter" class="card hidden">
<label for="dept">소속/부서</label>
<input id="dept" type="text" maxlength="30" placeholder="OO파트" autocomplete="off">
<label for="author">이름 또는 닉네임 (비워두면 익명)</label>
<input id="author" type="text" maxlength="20" placeholder="닉네임" autocomplete="off">
<p id="enterErr" class="err" role="alert"></p>
<button id="btnStart" class="primary block">시작하기</button>
</section>

<section id="screenSurvey" class="card hidden">
  <p style="font-size:18px;font-weight:600;margin:0 0 2px">교육은 어떠셨나요?</p>
  <p class="desc" style="margin:0">2문항 · 1인 1회 응답</p>
  <div id="qList"></div>
  <p id="surveyErr" class="err" role="alert"></p>
  <button id="btnSurveySubmit" type="button" class="primary block" style="margin-top:8px">제출하고 의견 남기기</button>
  <button id="btnSkip" type="button" class="block" style="margin-top:8px">건너뛰기</button>
</section>

<section id="screenBoard" class="hidden layout">
  <div class="side"><div class="card">
    <div class="row" style="margin-bottom:12px">
      <span class="me" id="meText"></span>
      <button id="btnChange" type="button">정보 변경</button>
    </div>
    <div class="chips" id="catChips" role="group" aria-label="의견 종류">
      <button type="button" class="chip" data-cat="good" aria-pressed="true">잘한 부분</button>
      <button type="button" class="chip" data-cat="improve" aria-pressed="false">개선이 필요한 부분</button>
    </div>
    <label for="content" style="margin-top:12px">의견</label>
    <textarea id="content" maxlength="200" placeholder="구체적으로 적어주시면 큰 도움이 됩니다"></textarea>
    <div class="row" style="margin-top:6px"><span class="cnt" id="cnt">0 / 200</span></div>
    <div class="hint">비방과 욕설은 마음의 상처가 됩니다. 따뜻한 응원의 말은 힘이 됩니다.<br>환자 정보와 개인정보는 적지 마세요.</div>
    <p id="postErr" class="err" role="alert"></p>
    <button id="btnPost" class="primary block" style="margin-top:8px">붙이기</button>
  </div></div>

  <div class="main">
  <div class="card" id="ratingCard">
    <div class="row">
      <strong id="rateTitle" style="font-size:15px">교육 평가</strong>
      <button id="btnRate" type="button" class="hidden" style="min-height:36px;font-size:13px;padding:0 12px">평가 남기기</button>
    </div>
    <div id="rateSum"></div>
  </div>
  <div class="bar">
    <div class="chips" id="filterChips" role="group" aria-label="보기 필터">
      <button type="button" class="chip" data-f="all" aria-pressed="true">전체 <span data-c="all">0</span></button>
      <button type="button" class="chip" data-f="good" aria-pressed="false">잘한 부분 <span data-c="good">0</span></button>
      <button type="button" class="chip" data-f="improve" aria-pressed="false">개선이 필요한 부분 <span data-c="improve">0</span></button>
    </div>
  </div>
  <div class="board" id="board"></div>
  </div>
</section>

<footer class="foot">교육 관련 문의: <a href="mailto:jmkim@jlkgroup.com">jmkim@jlkgroup.com</a></footer>

</div>

<div id="editOv" class="overlay" role="dialog" aria-modal="true" aria-label="내 메모 수정">
  <div class="modal" style="text-align:left;max-width:380px">
    <p style="font-size:16px;font-weight:600;margin:0 0 10px">내 메모 수정</p>
    <div class="chips" id="editCat" role="group" aria-label="의견 종류">
      <button type="button" class="chip" data-cat="good" aria-pressed="true">잘한 부분</button>
      <button type="button" class="chip" data-cat="improve" aria-pressed="false">개선이 필요한 부분</button>
    </div>
    <textarea id="editText" maxlength="200" style="margin-top:10px" aria-label="의견"></textarea>
    <p id="editErr" class="err" role="alert"></p>
    <div class="row" style="margin-top:6px">
      <button id="btnEditDel" type="button" style="color:var(--danger)">삭제</button>
      <span style="display:flex;gap:8px"><button id="btnEditCancel" type="button">취소</button><button id="btnEditSave" type="button" class="primary">저장</button></span>
    </div>
  </div>
</div>

<div id="thanks" class="overlay" role="dialog" aria-modal="true" aria-label="감사 인사">
  <div class="modal"><p class="big">감사합니다 ☺️</p><p class="small">소중한 의견이 붙었습니다</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 피드백 롤링페이퍼 메인 스크립트 (Supabase 연동, 설정 비어 있으면 이 기기에만 저장되는 미리보기 모드)
const CONFIG = {
  TITLE: '교육 피드백 롤링페이퍼',
  SUPABASE_URL: 'https://ecfhsputhgoxrfycmtib.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjZmhzcHV0aGdveHJmeWNtdGliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNzEzODEsImV4cCI6MjEwNzg0NzM4MX0.UtsNArXy4kuZTlWRMfXTOdEhgRPlS1q092v84y0-PGg',  // 공개용 anon 키 (접근은 DB 정책으로 제한)
  // 평가 문항 (DB 컬럼이 q1, q2 두 개라 문항은 2개까지. 문구만 바꿔서 사용)
  QUESTIONS: [
    { key: 'q1', text: '교육 내용에 전반적으로 만족하셨나요?' },
    { key: 'q2', text: '업무에 도움이 되는 내용이었나요?' }
  ],
  SCALE: ['매우 아쉬움', '아쉬움', '보통', '좋음', '매우 좋음']
};

const $ = (id) => document.getElementById(id);
const LABEL = { good: '잘한 부분', improve: '개선이 필요한 부분' };
const notes = new Map();
let cat = 'good', filter = 'all', sb = null, lastPost = 0;

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

document.title = CONFIG.TITLE;
$('title').textContent = CONFIG.TITLE;

const remote = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
if (remote && window.supabase) {
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
} else {
  const b = $('modeBanner');
  b.classList.remove('hidden');
  b.textContent = remote ? '서버 연결 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.' : '미리보기 모드: 이 기기에만 저장됩니다.';
}

async function loadAll(){
  if (sb) {
    const { data, error } = await sb.from('feedback').select('*').order('created_at', { ascending: false }).limit(500);
    if (error) throw error;
    return data;
  }
  try { return JSON.parse(lsGet('fb_local') || '[]'); } catch(e){ return []; }
}

function getMine(){ try { return JSON.parse(lsGet('fb_mine') || '{}'); } catch(e){ return {}; } }
function setMine(id, token){ const m = getMine(); m[id] = token; lsSet('fb_mine', JSON.stringify(m)); }
function dropMine(id){ const m = getMine(); delete m[id]; lsSet('fb_mine', JSON.stringify(m)); }
function newToken(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function localArr(){ try { return JSON.parse(lsGet('fb_local') || '[]'); } catch(e){ return []; } }

async function insertNote(n){
  const token = newToken();
  let row;
  if (sb) {
    const { data, error } = await sb.rpc('add_feedback', { p_dept: n.dept, p_author: n.author, p_category: n.category, p_content: n.content, p_token: token });
    if (error) throw error;
    row = data;
  } else {
    row = Object.assign({ id: 'l' + Date.now(), created_at: new Date().toISOString() }, n);
    const arr = localArr();
    arr.unshift(row);
    lsSet('fb_local', JSON.stringify(arr));
  }
  setMine(row.id, token);
  return row;
}

async function editNote(id, content, category){
  const token = getMine()[id];
  if (!token) throw new Error('not_owner');
  if (sb) {
    const { data, error } = await sb.rpc('edit_feedback', { p_id: Number(id), p_token: token, p_content: content, p_category: category });
    if (error) throw error;
    return data;
  }
  const arr = localArr();
  const r = arr.find(x => String(x.id) === String(id));
  if (!r) throw new Error('not_found');
  r.content = content; r.category = category; r.edited_at = new Date().toISOString();
  lsSet('fb_local', JSON.stringify(arr));
  return r;
}

async function removeNote(id){
  const token = getMine()[id];
  if (!token) throw new Error('not_owner');
  if (sb) {
    const { error } = await sb.rpc('delete_feedback', { p_id: Number(id), p_token: token });
    if (error) throw error;
  } else {
    lsSet('fb_local', JSON.stringify(localArr().filter(x => String(x.id) !== String(id))));
  }
  dropMine(id);
}

const ratings = new Map();

async function loadRatings(){
  if (sb) {
    const { data, error } = await sb.from('rating').select('id,q1,q2').limit(1000);
    if (error) throw error;
    return data;
  }
  try { return JSON.parse(lsGet('fb_ratings') || '[]'); } catch(e){ return []; }
}

async function insertRating(r){
  if (sb) {
    const { data, error } = await sb.from('rating').insert(r).select('id,q1,q2').single();
    if (error) throw error;
    return data;
  }
  const row = Object.assign({ id: 'r' + Date.now() }, r);
  let arr = [];
  try { arr = JSON.parse(lsGet('fb_ratings') || '[]'); } catch(e){}
  arr.push(row);
  lsSet('fb_ratings', JSON.stringify(arr));
  return row;
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderRatings(){
  const box = $('rateSum');
  box.textContent = '';
  const list = Array.from(ratings.values());
  $('rateTitle').textContent = '교육 평가 (' + list.length + '명 응답)';
  if (!list.length) { box.appendChild(el('p', 'cnt', '아직 응답이 없습니다.')); return; }
  CONFIG.QUESTIONS.forEach(q => {
    const vals = list.map(r => r[q.key]).filter(v => v >= 1 && v <= 5);
    const counts = [0, 0, 0, 0, 0];
    vals.forEach(v => counts[v - 1]++);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    const head = el('div', 'sumq');
    const avgEl = el('span', 'avg', avg.toFixed(1));
    avgEl.appendChild(el('small', '', ' / 5'));
    head.append(el('span', 'qt', q.text), avgEl);
    const max = Math.max.apply(null, counts.concat([1]));
    const hist = el('div', 'hist');
    const lab = el('div', 'hlab');
    counts.forEach((c, i) => {
      const col = el('div', 'col');
      col.appendChild(el('span', 'n', String(c)));
      const f = el('div', 'fill');
      f.style.height = Math.round(c / max * 40) + 'px';
      col.appendChild(f);
      hist.appendChild(col);
      lab.appendChild(el('span', '', String(i + 1)));
    });
    box.append(head, hist, lab);
  });
}

function hash(s){ let h = 0; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }

function render(){
  const list = Array.from(notes.values()).sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  const cnt = { all: list.length, good: 0, improve: 0 };
  list.forEach(n => { if (cnt[n.category] !== undefined) cnt[n.category]++; });
  document.querySelectorAll('[data-c]').forEach(el => { el.textContent = cnt[el.dataset.c]; });
  const view = filter === 'all' ? list : list.filter(n => n.category === filter);
  const board = $('board');
  board.textContent = '';
  if (!view.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '아직 붙은 메모가 없습니다. 첫 의견을 남겨주세요.';
    board.appendChild(e);
    return;
  }
  view.forEach(n => {
    const d = document.createElement('div');
    d.className = 'note ' + n.category;
    d.style.transform = 'rotate(' + (((Math.abs(hash(n.id)) % 41) - 20) / 10) + 'deg)';
    const t = document.createElement('div'); t.className = 'tag'; t.textContent = LABEL[n.category] || '';
    const b = document.createElement('div'); b.className = 'body'; b.textContent = n.content;
    const w = document.createElement('div'); w.className = 'who'; w.textContent = n.dept + ' · ' + (n.author || '익명') + (n.edited_at ? ' · 수정됨' : '');
    d.append(t, b, w);
    if (getMine()[n.id]) {
      const eb = document.createElement('button');
      eb.type = 'button'; eb.className = 'editbtn'; eb.textContent = '수정';
      eb.setAttribute('aria-label', '내 메모 수정');
      eb.addEventListener('click', () => openEdit(n.id));
      d.appendChild(eb);
    }
    board.appendChild(d);
  });
}

async function refresh(){
  try {
    const rows = await loadAll();
    notes.clear();
    rows.forEach(r => notes.set(String(r.id), r));
    render();
  } catch(e){
    $('postErr').textContent = '메모를 불러오지 못했습니다. 네트워크를 확인해 주세요.';
  }
  try {
    const rr = await loadRatings();
    rr.forEach(r => ratings.set(String(r.id), r));
    renderRatings();
  } catch(e){
    $('rateSum').textContent = '평가를 불러오지 못했습니다.';
  }
}

let booted = false;

function hideAll(){
  ['screenEnter', 'screenSurvey', 'screenBoard'].forEach(id => $(id).classList.add('hidden'));
}

function showBoard(){
  hideAll();
  $('screenBoard').classList.remove('hidden');
  $('meText').textContent = lsGet('fb_dept') + ' · ' + (lsGet('fb_author') || '익명');
  $('btnRate').classList.toggle('hidden', !!lsGet('fb_rated'));
  refresh();
  if (booted) return;
  booted = true;
  if (sb) {
    sb.channel('fb-room')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'feedback' }, (p) => {
        notes.set(String(p.new.id), p.new);
        render();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'feedback' }, (p) => {
        notes.set(String(p.new.id), p.new);
        render();
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'feedback' }, (p) => {
        notes.delete(String(p.old.id));
        render();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rating' }, (p) => {
        ratings.set(String(p.new.id), p.new);
        renderRatings();
      })
      .subscribe();
    setInterval(refresh, 20000);
  }
}

function showEnter(){
  hideAll();
  $('screenEnter').classList.remove('hidden');
  $('dept').value = lsGet('fb_dept') || '';
  $('author').value = lsGet('fb_author') || '';
}

$('btnStart').addEventListener('click', () => {
  const dept = $('dept').value.trim();
  if (!dept) { $('enterErr').textContent = '소속/부서를 입력해 주세요'; $('dept').focus(); return; }
  lsSet('fb_dept', dept);
  lsSet('fb_author', $('author').value.trim());
  $('enterErr').textContent = '';
  route();
});
['dept', 'author'].forEach(id => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnStart').click(); }));
$('btnChange').addEventListener('click', showEnter);

$('catChips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  cat = b.dataset.cat;
  document.querySelectorAll('#catChips .chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
});
$('filterChips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filterChips .chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  render();
});
$('content').addEventListener('input', () => {
  $('cnt').textContent = $('content').value.length + ' / 200';
  $('postErr').textContent = '';
});

function thank(){
  const o = $('thanks');
  o.classList.add('on');
  const close = () => { o.classList.remove('on'); o.removeEventListener('click', close); };
  o.addEventListener('click', close);
  setTimeout(close, 1800);
}

$('btnPost').addEventListener('click', async () => {
  const text = $('content').value.trim();
  if (!text) { $('postErr').textContent = '의견을 입력해 주세요'; $('content').focus(); return; }
  if (Date.now() - lastPost < 3000) { $('postErr').textContent = '잠시 후 다시 붙여주세요'; return; }
  const btn = $('btnPost');
  btn.disabled = true;
  try {
    const row = await insertNote({ dept: lsGet('fb_dept'), author: lsGet('fb_author') || '익명', category: cat, content: text });
    notes.set(String(row.id), row);
    lastPost = Date.now();
    $('content').value = '';
    $('cnt').textContent = '0 / 200';
    $('postErr').textContent = '';
    render();
    thank();
  } catch(e){
    $('postErr').textContent = '등록하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  } finally {
    btn.disabled = false;
  }
});

let editId = null, editCatVal = 'good';

function openEdit(id){
  const n = notes.get(String(id));
  if (!n) return;
  editId = id;
  editCatVal = n.category;
  $('editText').value = n.content;
  $('editErr').textContent = '';
  document.querySelectorAll('#editCat .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.cat === editCatVal)));
  $('editOv').classList.add('on');
  $('editText').focus();
}
function closeEdit(){ $('editOv').classList.remove('on'); editId = null; }

$('editCat').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  editCatVal = b.dataset.cat;
  document.querySelectorAll('#editCat .chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
});
$('btnEditCancel').addEventListener('click', closeEdit);
$('btnEditSave').addEventListener('click', async () => {
  const text = $('editText').value.trim();
  if (!text) { $('editErr').textContent = '의견을 입력해 주세요'; return; }
  const btn = $('btnEditSave'); btn.disabled = true;
  try {
    const row = await editNote(editId, text, editCatVal);
    notes.set(String(row.id), row);
    closeEdit();
    render();
  } catch(e){
    $('editErr').textContent = '수정하지 못했습니다. 이 메모를 작성한 기기에서만 수정할 수 있습니다.';
  } finally { btn.disabled = false; }
});
$('btnEditDel').addEventListener('click', async () => {
  if (!window.confirm('이 메모를 삭제할까요?')) return;
  try {
    await removeNote(editId);
    notes.delete(String(editId));
    closeEdit();
    render();
  } catch(e){
    $('editErr').textContent = '삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  }
});

const answers = {};
let surveyBuilt = false;

function setAnswer(key, v){
  answers[key] = v;
  const row = document.querySelector('[data-q="' + key + '"]');
  row.querySelector('.slider').classList.remove('untouched');
  row.querySelector('input').value = v;
  row.querySelector('.val').textContent = v + '점 · ' + CONFIG.SCALE[v - 1];
  row.querySelectorAll('.ticks button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === v - 1)));
  $('surveyErr').textContent = '';
}

function buildSurvey(){
  if (surveyBuilt) return;
  surveyBuilt = true;
  CONFIG.QUESTIONS.forEach(q => {
    const row = el('div');
    row.dataset.q = q.key;
    const sl = el('div', 'slider untouched');
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = 1; inp.max = 5; inp.step = 1; inp.value = 3;
    inp.setAttribute('aria-label', q.text);
    inp.addEventListener('input', () => setAnswer(q.key, Number(inp.value)));
    inp.addEventListener('click', () => { if (!answers[q.key]) setAnswer(q.key, Number(inp.value)); });
    sl.appendChild(inp);
    const ticks = el('div', 'ticks');
    CONFIG.SCALE.forEach((s, i) => {
      const b = el('button', '', s);
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => setAnswer(q.key, i + 1));
      ticks.appendChild(b);
    });
    row.append(el('p', 'rate-q', q.text), el('div', 'val', '좌우로 움직이거나 아래 글자를 눌러 선택'), sl, ticks);
    $('qList').appendChild(row);
  });
}

function showSurvey(){
  hideAll();
  $('screenSurvey').classList.remove('hidden');
  buildSurvey();
}

$('btnSurveySubmit').addEventListener('click', async () => {
  if (CONFIG.QUESTIONS.some(q => !answers[q.key])) { $('surveyErr').textContent = '모든 문항에 답해 주세요'; return; }
  if (lsGet('fb_rated')) { showBoard(); return; }
  const btn = $('btnSurveySubmit');
  btn.disabled = true;
  try {
    const r = { dept: lsGet('fb_dept') };
    CONFIG.QUESTIONS.forEach(q => { r[q.key] = answers[q.key]; });
    const row = await insertRating(r);
    ratings.set(String(row.id), row);
    lsSet('fb_rated', '1');
    renderRatings();
    showBoard();
    thank();
  } catch(e){
    $('surveyErr').textContent = '제출하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  } finally {
    btn.disabled = false;
  }
});
$('btnSkip').addEventListener('click', () => { lsSet('fb_skip', '1'); showBoard(); });
$('btnRate').addEventListener('click', showSurvey);

function route(){
  if (!lsGet('fb_dept')) showEnter();
  else if (!lsGet('fb_rated') && !lsGet('fb_skip')) showSurvey();
  else showBoard();
}

route();
</script>
